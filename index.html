<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nongsao</title>
<style>
  :root{
    --ink:#15110c;
    --ink-2:#1d1712;
    --text:#f3ecdd;
    --muted:#9a9184;
    --pink:#ff2e7e;
    --line:rgba(243,236,221,.14);
    color-scheme:dark;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--ink);color:var(--text);}
  ::selection{background:var(--pink);color:var(--ink);}
  img{max-width:100%;}

  .page{
    position:relative;
    max-width:920px;
    margin:0 auto;
    padding-inline:20px;
    padding-block:28px 60px;
    font-family:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
  }

  a{color:var(--pink);text-decoration-thickness:1.5px;text-underline-offset:2px;}
  a:hover{color:var(--pink);}
  a:focus-visible, button:focus-visible{outline:2px solid var(--pink);outline-offset:3px;}

  .section-label{
    position:relative;
    z-index:1;
    font-family:'Space Mono',monospace;
    font-size:12px;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--muted);
    margin:0 0 26px;
    display:flex;
    align-items:center;
    gap:12px;
  }
  .section-label::after{
    content:"";
    flex:1;
    height:1px;
    background:var(--line);
  }

  .releases{
    position:relative;
    z-index:1;
    display:flex;
    flex-direction:column;
    gap:22px;
  }

  .release-card{
    background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02));
    border:1px solid var(--line);
    border-radius:14px;
    padding:26px;
    position:relative;
    transition:transform .25s ease, border-color .25s ease;
  }
  @media (prefers-reduced-motion:no-preference){
    .release-card:hover{transform:translateY(-3px);border-color:rgba(243,236,221,.28);}
  }

  .release-head{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:16px;
    flex-wrap:wrap;
    margin-bottom:18px;
  }
  .release-head h3{
    font-family:'Archivo',sans-serif;
    font-weight:700;
    font-size:clamp(20px,3.4vw,26px);
    line-height:1.1;
    margin:0;
    letter-spacing:-.01em;
    text-wrap:balance;
  }
  .release-date{
    font-family:'Space Mono',monospace;
    font-size:11.5px;
    letter-spacing:.05em;
    color:var(--muted);
    white-space:nowrap;
    font-variant-numeric:tabular-nums;
  }

  .player{
    max-width:400px;
    border-radius:8px;
    overflow:hidden;
  }
  .player iframe{
    width:100%;
    display:block;
    border:0;
  }
  .player a{color:var(--text);}
  .banner{
    position:relative;
    width:100%;
    aspect-ratio:2/1;
    max-height:78vh;
    min-height:240px;
    overflow:hidden;
  }
  .banner img{
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center;
    display:block;
  }
  .banner::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(180deg, rgba(21,17,12,0) 88%, var(--ink) 99%);
  }
</style>
